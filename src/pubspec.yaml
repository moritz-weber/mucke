name: mucke
description: music player
publish_to: none

version: 1.6.0+13

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  async_task: ^1.0.20
  audio_service: ^0.18.18  # MIT
  audio_session: ^0.2.2  # MIT
  battery_optimization_helper: ^0.2.0
  collection: ^1.17.1  # BSD 3
  device_info_plus: ^12.4.0  # BSD 3; required to get SDK verion
  drift: ^2.9.0  # MIT
  equatable: ^2.0.3  # MIT
  file_picker: ^11.0.2  # MIT
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.0.0  # MIT
  flutter_speed_dial: ^7.0.0  # MIT
  get_it: ^9.2.1  # MIT
  haudiotagger: ^1.2.9
  image: ^4.9.1
  intl: any
  just_audio: ^0.10.5  # MIT
  logging: ^1.0.2
  mobx: 2.6.0  # MIT
  package_info_plus: ^9.0.1  # BSD 3; required to get app version for data export
  page_indicator_plus: ^1.0.3  # MIT
  path: ^1.8.0  # BSD 3
  path_provider: ^2.0.2  # BSD 3
  permission_handler: ^12.0.1  # MIT
  reorderables: ^0.6.0  # MIT
  share_plus: ^12.0.2
  string_similarity: ^2.0.0  # MIT
  text_scroll: ^0.2.0  # MIT

dev_dependencies:
  build_runner: ^2.4.6  # BSD 3
  drift_dev: ^2.5.0  # MIT
  flutter_test:
    sdk: flutter
  mobx_codegen: ^2.7.6  # MIT
  mockito: ^5.4.2
  test: ^1.25.15


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true  # added for l10n

  uses-material-design: true
  assets:
    - assets/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  fonts:
    - family:  MuckeIcons
      fonts:
        - asset: fonts/MuckeIcons.ttf

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
